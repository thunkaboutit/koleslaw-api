name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  trigger-deploy:
    runs-on: self-hosted
    environment: dev
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Trigger kowpen deploy for API
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.REPO_ACCESS_TOKEN }}" \
            https://api.github.com/repos/thunkaboutit/koleslaw-kowpen/dispatches \
            -d '{"event_type":"deploy-api"}'
