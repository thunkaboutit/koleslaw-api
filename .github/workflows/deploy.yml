name: Deploy

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]

jobs:
  trigger-deploy:
    runs-on: self-hosted
    environment: dev
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Trigger koleslaw-kowpen deploy for API
        env:
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
        run: gh workflow run deploy.yml -R thunkaboutit/koleslaw-kowpen -f service=api
